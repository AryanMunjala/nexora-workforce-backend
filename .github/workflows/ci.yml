name: Build Nexora Workforce Backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: nexora-backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
